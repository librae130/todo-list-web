name: Deploy
on:
  push:
    branches: [test-cicd]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token for Azure login
      contents: read
    env:
      APP_ENV: ${{ vars.APP_ENVIRONMENT }}
    steps:
      - name: Check APP_ENVIRONMENT
        run: |
          case "$APP_ENV" in
            Development|Production) echo "Deploying as $APP_ENV" ;;
            *) echo "::error::Set the APP_ENVIRONMENT variable to Development or Production"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      # ---------- Frontend ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm run build

      # ---------- Backend ----------
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish backend
        run: dotnet publish backend/backend.csproj -c Release -o backend/publish
      - name: Write appsettings
        env:
          SQL_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          DB_SERVER: ${{ vars.DB_SERVER_FQDN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          JWT_KEY: ${{ secrets.JWT_SIGNING_KEY }}
        run: |
          jq -n \
            --arg conn "Server=tcp:${DB_SERVER},1433;Database=TodoApp;User Id=dbadmin;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=False;" \
            --arg origin "${FRONTEND_URL%/}" \
            --arg jwtkey "$JWT_KEY" \
            '{
              ConnectionStrings: {DatabaseConnection: $conn},
              Cors: {AllowedOrigins: [$origin, $origin]},
              Jwt: {
                Key: $jwtkey,
                Issuer: "TodoAppBackend",
                Audience: "TodoAppFrontend",
                AccessTokenDurationInMinute: 15,
                RefreshTokenDurationInDay: 7
              }
            }' > "backend/publish/appsettings.${APP_ENV}.json"
          ls -lh "backend/publish/appsettings.${APP_ENV}.json"
      - name: Build EF migration bundle
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
          ConnectionStrings__DatabaseConnection: >-
            Server=tcp:${{ vars.DB_SERVER_FQDN }},1433;Database=TodoApp;User Id=dbadmin;Password=${{ secrets.SQL_ADMIN_PASSWORD }};Encrypt=True;TrustServerCertificate=False;
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project backend.csproj \
            --self-contained -r linux-x64 \
            --output publish/efbundle \
            --force
          ls -lh publish/efbundle

      # ---------- Deploy ----------
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload frontend to storage account
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.STORAGE_ACCOUNT_NAME }}" \
            --destination '$web' \
            --source frontend/dist \
            --auth-mode key \
            --overwrite

      - name: Open SSH for this runner
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          az network nsg rule create -g todo-app-rg --nsg-name todo-app-nsg \
            -n Allow-SSH-Runner --priority 105 --access Allow --protocol Tcp \
            --direction Inbound --source-address-prefixes "$RUNNER_IP/32" \
            --destination-port-ranges 22 --only-show-errors -o none
          sleep 20

      - name: Deploy backend over SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_IP: ${{ vars.VM_IP }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          install -m 600 /dev/null key
          echo "$SSH_KEY" > key
          OPTS="-i key -o StrictHostKeyChecking=accept-new"

          echo "::group::Copy files to the VM"
          rsync -az --delete -e "ssh $OPTS" backend/publish/ "azureuser@$VM_IP:/tmp/api-publish/"
          scp $OPTS infra/azure/scripts/deploy-api-vm.sh "azureuser@$VM_IP:/tmp/deploy-api-vm.sh"
          echo "::endgroup::"

          echo "::group::Run deployment script on the VM"
          API_DOMAIN="${API_BASE_URL#https://}"
          ssh $OPTS "azureuser@$VM_IP" "sudo bash /tmp/deploy-api-vm.sh /tmp/api-publish $API_DOMAIN $APP_ENV"
          echo "::endgroup::"

      - name: Close SSH
        if: always()
        run: |
          az network nsg rule delete -g todo-app-rg --nsg-name todo-app-nsg \
            -n Allow-SSH-Runner --only-show-errors || true

      - name: Smoke test
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          # No --fail: a 404 on "/" still proves Caddy, TLS and the API are up.
          curl -sS -o /dev/null -w "API responded with HTTP %{http_code}\n" \
            --retry 10 --retry-delay 6 --retry-all-errors "${API_BASE_URL}/"
